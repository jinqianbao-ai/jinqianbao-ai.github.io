<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="金钱豹AI站内论坛：AI日报、分享交流、问答求助、文内批注、投票与综合讨论。">
<title>金钱豹AI论坛</title>
<style>
:root{--ink:#191919;--muted:#68635d;--paper:#fff;--warm:#f6f5f4;--line:rgba(0,0,0,.11);--blue:#0075de;--blue-soft:#f1f8ff;--shadow:0 5px 20px rgba(0,0,0,.045)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit}:focus-visible{outline:3px solid rgba(0,117,222,.3);outline-offset:2px}button{font:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topbar{max-width:1180px;margin:auto;padding:11px 18px;display:flex;align-items:center;gap:18px}.brand{font-weight:780;text-decoration:none;font-size:18px}.topbar nav{margin-left:auto;display:flex;gap:10px}.topbar nav a{text-decoration:none;color:var(--muted);padding:8px 10px;border-radius:8px;font-weight:630;font-size:14px}.topbar nav a.active{background:var(--blue-soft);color:var(--blue)}
.shell{max-width:1180px;margin:auto;padding:26px 18px 74px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}.sidebar{position:sticky;top:76px;align-self:start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.sidebar-title{padding:15px 16px;border-bottom:1px solid var(--line);font-weight:730}.section-nav a{display:block;padding:13px 15px;text-decoration:none;border-bottom:1px solid var(--line)}.section-nav a:last-child{border-bottom:0}.section-nav a:hover,.section-nav a.active{background:var(--warm)}.section-nav a.active{box-shadow:inset 3px 0 var(--blue)}.section-nav b,.section-nav small{display:block}.section-nav b{font-size:15px}.section-nav small{font-size:12px;line-height:1.45;color:var(--muted);margin-top:2px}
.content-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:2px 0 18px}.content-head h1{font-size:30px;line-height:1.2;margin:0 0 5px}.content-head p{color:var(--muted);margin:0}.compose-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:680;white-space:nowrap}.topic-list{display:grid;gap:12px}.topic-card{display:block;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;box-shadow:var(--shadow)}.topic-card:hover{border-color:rgba(0,117,222,.38)}.topic-card h2{font-size:19px;line-height:1.4;margin:0 0 6px}.topic-card p{color:var(--muted);font-size:14px;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.topic-card-meta{font-size:12px;color:var(--muted)}.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.board{margin-top:26px;border:1px solid var(--line);border-radius:15px;padding:20px}.board h2{font-size:22px;margin:0 0 5px}.board>p{color:var(--muted);margin:0 0 16px}.giscus-host{min-height:90px}
.topic-view[data-open="false"]{display:none}.topic-back{appearance:none;border:0;background:transparent;color:var(--blue);font-weight:680;padding:8px 0;cursor:pointer;min-height:44px}.topic-article{border:1px solid var(--line);border-radius:15px;padding:24px;background:#fff}.topic-article h1{font-size:28px;line-height:1.3;margin:5px 0 7px}.topic-meta{color:var(--muted);font-size:13px;margin-bottom:20px}.topic-body{white-space:pre-wrap;font-size:16px;line-height:1.8}.topic-comments{margin-top:20px;border:1px solid var(--line);border-radius:15px;padding:20px}.topic-comments h2{font-size:21px;margin:0 0 5px}.topic-comments>p{color:var(--muted);margin:0 0 14px}
.mobile-nav{display:none}footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;padding:24px 15px 36px}
@media(max-width:820px){.shell{grid-template-columns:210px minmax(0,1fr);gap:18px;padding-inline:14px}.content-head{display:block}.compose-link{margin-top:12px}.topic-article{padding:20px}}
@media(max-width:640px){.topbar{padding:10px 14px}.topbar nav a:first-child{display:none}.shell{display:block;padding:14px 12px 82px}.sidebar{position:static;border:0;box-shadow:none;overflow:visible;margin-bottom:18px}.sidebar-title{display:none}.section-nav{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}.section-nav::-webkit-scrollbar{display:none}.section-nav a{flex:0 0 auto;border:1px solid var(--line)!important;border-radius:999px;padding:8px 12px;min-height:42px}.section-nav a.active{background:var(--blue);color:#fff;box-shadow:none;border-color:var(--blue)!important}.section-nav small{display:none}.content-head h1{font-size:25px}.topic-card{padding:16px}.topic-article{padding:17px 15px}.topic-article h1{font-size:24px}.board,.topic-comments{padding:16px 12px}.mobile-nav{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:13px;box-shadow:0 7px 25px rgba(0,0,0,.14);padding:5px}.mobile-nav a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:650;padding:9px 4px;min-height:42px;color:var(--muted)}}
@media(prefers-color-scheme:dark){:root{--ink:#f1efeb;--muted:#b8b2aa;--paper:#161616;--warm:#222120;--line:rgba(255,255,255,.13);--blue:#6ab5ff;--blue-soft:#13293c;--shadow:none}header,.mobile-nav{background:rgba(22,22,22,.94)}.sidebar,.topic-card,.topic-article{background:#1c1c1c}.compose-link{color:#07111b}.section-nav a.active{color:#07111b}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
